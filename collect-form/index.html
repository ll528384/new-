<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测试</title>
<style>
    textarea:invalid{
        border-color: red;
    }
    textarea:focus{
        border-color:#3498db;
        box-shadow: 0 0 0 3px rgba(52,152,219,0.5);
    }
  </style>
</head>
<body>
    <p>
        <label for="advice">测试框</label><br>
        <textarea id="advice" name="advice" rows="4" maxlength="200" required placeholder="说点什么"></textarea>
    </p>
    <p>
        <button type="submit">提交</button>
    </p>
</body>
</html>
