<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>课程反馈</title>
    </head>
    <body>
        <header>
            <h1>课程反馈</h1>
            <p>你的意见直接改进下一次授课</p>
        </header>
        <nav>
            <a href="#intro">填写说明</a>
            <a href="#form">开始填写</a>
        </nav>
        <main>
            <section id="intro">
                <h2>填写说明</h2>
                <p>匿名收集，仅用于改进教学，两分钟填完</p>
            </section>
        </main>
        <footer>
            <p>软件开发综合实践.课程演示案例</p>
        </footer>
    </body>
    </html>
<form action="#" method="get" >
    <p>
        <label for="name">姓名（可填昵称）</label>
        <input type="text" id="name" name="name" placeholder="怎么称呼你"required>
    </p>
    <p>
        <label for="email">邮箱</label>
        <input type="email" id="mail" name="mail"required>
    </p>
    <p>课程评分</p>
    <p>
        <label><input type="radio" name="score" value="5"checked>很好</label>
        <label><input type="radio" name="score" value="4">好</label>
        <label><input type="radio" name="score" value="3">一般</label>
    </p>
    <p>
        <button type="submit">提交反馈</button>
    </p>
</form>
